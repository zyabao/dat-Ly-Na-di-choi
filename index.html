<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chọn địa điểm đi chơi 💕</title>

<style>
body {
  font-family: "Comic Sans MS";
  background:#ffeef2;
  text-align:center;
}

h1 { color:#ff6b81; }

table {
  margin:20px auto;
  background:white;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

th,td { padding:10px; }
th { background:#ffcad4; }

input[type="checkbox"] { transform:scale(1.3); }

button {
  padding:8px 10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.add-btn {
  margin-top:10px;
  background:#ff6b81;
  color:white;
}

.delete-btn {
  background:#ff4d4d;
  color:white;
}
</style>
</head>

<body>

<h1>💖 Chọn địa điểm đi chơi 💖</h1>

<table id="table">
<thead>
<tr>
<th>Ý tưởng 💡</th>
<th>Địa chỉ 📍</th>
<th>😍</th>
<th>😒</th>
<th>Ưu tiên</th>
<th>Đã hoàn thành</th>
<th>❌</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button class="add-btn" onclick="addRow()">➕ Thêm ý tưởng</button>

<script>
const API_URL = "https://sheetdb.io/api/v1/0vnu9lnzuwycf";

// thêm dòng
function addRow() {
  const row = document.createElement("tr");

  row.innerHTML = `
    <td><input></td>
    <td><input></td>
    <td><input type="checkbox" onchange="updateAll()"></td>
    <td><input type="checkbox" onchange="updateAll()"></td>
    <td></td>
    <td></td>
    <td><button class="delete-btn" onclick="deleteRow(this)">❌</button></td>
  `;

  document.querySelector("#table tbody").appendChild(row);
}

// xoá dòng
function deleteRow(btn) {
  btn.parentElement.parentElement.remove();
  updateAll();
  saveData();
}

// xử lý logic
function updateAll() {
  let p = 1;

  document.querySelectorAll("#table tbody tr").forEach(row=>{
    const like = row.children[2].querySelector("input");
    const dislike = row.children[3].querySelector("input");
    const done = row.children[5];

    if(dislike.checked){
      like.checked = false;
      done.innerHTML = "❌";
      row.children[4].textContent = "";
    }
    else if(like.checked){
      done.innerHTML = "<input type='checkbox'>";
      row.children[4].textContent = p++;
    }
    else{
      done.innerHTML = "";
      row.children[4].textContent = "";
    }
  });
}

// lưu dữ liệu
async function saveData(){
  const rows=[];

  document.querySelectorAll("#table tbody tr").forEach(row=>{
    rows.push({
      idea: row.children[0].querySelector("input").value,
      address: row.children[1].querySelector("input").value,
      like: row.children[2].querySelector("input").checked,
      dislike: row.children[3].querySelector("input").checked
    });
  });

  await fetch(API_URL, { method:"DELETE" });

  for (let r of rows){
    await fetch(API_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ data: r })
    });
  }
}

// load dữ liệu
async function loadData(){
  const res = await fetch(API_URL);
  const data = await res.json();

  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML="";

  data.forEach(item=>{
    addRow();
    const row = document.querySelector("#table tbody tr:last-child");

    row.children[0].querySelector("input").value = item.idea;
    row.children[1].querySelector("input").value = item.address;
    row.children[2].querySelector("input").checked = item.like === "true";
    row.children[3].querySelector("input").checked = item.dislike === "true";
  });

  updateAll();
}

// auto
loadData();
document.addEventListener("change", saveData);
document.addEventListener("input", saveData);
</script>

</body>
</html>
