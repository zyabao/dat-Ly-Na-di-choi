<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đi chơi 💕</title>

<style>
body { font-family: "Comic Sans MS"; background:#ffeef2; text-align:center;}
h1 { color:#ff6b81;}
table { margin:20px auto; background:white; border-radius:12px;}
th,td { padding:10px;}
th { background:#ffcad4;}
button { padding:8px 12px; border:none; border-radius:8px; margin:5px;}
.add {background:#ff6b81;color:white;}
.save {background:#2ed573;color:white;}
.del {background:#ff4d4d;color:white;}
</style>
</head>

<body>

<h1>💖 Đi chơi không em 💖</h1>

<table id="table">
<thead>
<tr>
<th>Ý tưởng</th>
<th>Địa chỉ</th>
<th>😍</th>
<th>😒</th>
<th>Ưu tiên</th>
<th>Done</th>
<th>❌</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button class="add" onclick="addRow()">➕ Thêm</button>
<button class="save" onclick="saveData()">💾 Lưu</button>

<script>
const API_URL = "https://sheetdb.io/api/v1/0vnu9lnzuwycf";

// thêm dòng
function addRow(){
  const row=document.createElement("tr");
  row.innerHTML=`
    <td><input></td>
    <td><input></td>
    <td><input type="checkbox" onchange="updateAll()"></td>
    <td><input type="checkbox" onchange="updateAll()"></td>
    <td></td>
    <td></td>
    <td><button class="del" onclick="del(this)">❌</button></td>
  `;
  document.querySelector("tbody").appendChild(row);
}

// xoá
function del(btn){
  btn.parentElement.parentElement.remove();
  updateAll();
}

// logic
function updateAll(){
  let p=1;
  document.querySelectorAll("tbody tr").forEach(r=>{
    const like=r.children[2].querySelector("input");
    const dislike=r.children[3].querySelector("input");
    const done=r.children[5];

    if(dislike.checked){
      like.checked=false;
      done.innerHTML="❌";
      r.children[4].textContent="";
    }
    else if(like.checked){
      done.innerHTML="<input type='checkbox'>";
      r.children[4].textContent=p++;
    }else{
      done.innerHTML="";
      r.children[4].textContent="";
    }
  });
}

// SAVE (1 lần duy nhất)
async function saveData(){
  const rows=[];

  document.querySelectorAll("tbody tr").forEach(r=>{
    rows.push({
      idea:r.children[0].querySelector("input").value,
      address:r.children[1].querySelector("input").value,
      like:r.children[2].querySelector("input").checked,
      dislike:r.children[3].querySelector("input").checked
    });
  });

  await fetch(API_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      data: { data: JSON.stringify(rows) }
    })
  });

  alert("Đã lưu 💖");
}

// LOAD
async function loadData(){
  const res=await fetch(API_URL);
  const json=await res.json();

  if(json.length===0) return;

  const last = json[json.length - 1];
const data = JSON.parse(last.data || "[]");

  const tbody=document.querySelector("tbody");
  tbody.innerHTML="";

  data.forEach(item=>{
    addRow();
    const r=document.querySelector("tbody tr:last-child");

    r.children[0].querySelector("input").value=item.idea;
    r.children[1].querySelector("input").value=item.address;
    r.children[2].querySelector("input").checked=item.like;
    r.children[3].querySelector("input").checked=item.dislike;
  });

  updateAll();
}

loadData();
</script>

</body>
</html>
